<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1f30"/>
      <stop offset="1" stop-color="#0b0c14"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="8%" r="70%">
      <stop offset="0" stop-color="#5b4bd6" stop-opacity=".45"/>
      <stop offset="1" stop-color="#5b4bd6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5fd0ff"/>
      <stop offset="1" stop-color="#3d7bff"/>
    </linearGradient>
  </defs>
  <!-- full-bleed square so it also works as a "maskable" icon; phones round the corners themselves -->
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#glow)"/>
  <g transform="rotate(-90 256 256)" fill="none" stroke-width="46" stroke-linecap="round">
    <circle cx="256" cy="256" r="150" stroke="rgba(255,255,255,.06)" stroke-linecap="butt"/>
    <circle cx="256" cy="256" r="150" stroke="url(#blue)" stroke-dasharray="414 528.48" stroke-dashoffset="0"/>
    <circle cx="256" cy="256" r="150" stroke="#e05a8c" stroke-dasharray="179 763.48" stroke-dashoffset="-490"/>
    <circle cx="256" cy="256" r="150" stroke="#22b07d" stroke-dasharray="121 821.48" stroke-dashoffset="-745"/>
  </g>
  <circle cx="256" cy="256" r="26" fill="#f2f3f7"/>
</svg>
